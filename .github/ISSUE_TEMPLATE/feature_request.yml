name: Feature request
description: Something scimkit should support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: A proposal
      description: An API sketch, or the RFC section that describes the behaviour.
